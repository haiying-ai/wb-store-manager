name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pillow openpyxl

      - name: 仓库内不含真实费率与成本表
        run: |
          found=$(git ls-files 'config/finance/**' 'config/pricing/**' \
            | grep -iE '\.json$' | grep -vE '\.example\.json$' || true)
          if [ -n "$found" ]; then
            echo "发现疑似真实配置（应只提交 *.example.json）："
            echo "$found"
            exit 1
          fi

      - name: 测试
        run: |
          # tools/ 被 .gitignore 排除（私有自动化脚本），下列用例 import 了它，干净克隆下
          # 无法收集。处理方式二选一：把 tools/ 下对应脚本入库，或删掉这些用例。
          python -m pytest -q \
            --ignore=tests/test_daily_report_collector.py \
            --ignore=tests/test_daily_report_render.py \
            --ignore=tests/test_fund_new_store_stable_cpm_20260909.py \
            --ignore=tests/test_historical_mixed_deposit_reconciliation.py \
            --ignore=tests/test_wps_feedback_apply.py \
            --ignore=tests/test_wps_return_collect.py \
            --ignore=tests/test_wps_update_status_note.py \
            --ignore=tests/test_wps_warehouse_cancellation_cleanup.py \
            --ignore=tests/test_wps_warehouse_collect.py \
            --ignore=tests/test_wps_warehouse_fulfillment_status.py \
            --ignore=tests/test_wps_warehouse_imei.py \
            --ignore=tests/test_wps_warehouse_prepare.py \
            --ignore=tests/test_wps_warehouse_return_sync.py \
            --ignore=tests/test_wps_warehouse_sequence_sync.py \
            --ignore=tests/test_wps_warehouse_status_sync.py \
            --ignore=tests/test_wps_warehouse_sync_api.py \
            --ignore=tests/test_monitor_new_store_stable_cpm_20260910.py \
            --ignore=tests/test_wps_warehouse_ledger.py
